    case'coffee':coffeeSheet(id);break;
    case'useCoffee':S.coffeeId=id;save();closeSheet();openBrew(el.dataset.r);if(tab==='cafes'||tab==='inicio')render();break;
    case'pickCoffee':coffeePicker();break;
    case'setCoffee':S.coffeeId=id;save();B.roast=coffeeById(id).roast;closeSheet();renderBrew();toast('Café trocado. Torra ajustada.');break;
    case'closeBrew':$('#brew').classList.remove('open');render();break;
    case'fav':{const i=S.favorites.indexOf(B.r.id);i>=0?S.favorites.splice(i,1):S.favorites.push(B.r.id);save();renderBrew();toast(i>=0?'Removida das favoritas':'Salva nas favoritas');break}
    case'roast':B.roast=id;segOn('#segRoast',id);updateBrew();break;
    case'dose':{const st=B.r.engine==='cold'?10:1;B.dose=Math.max(B.r.engine==='cold'?50:6,Math.min(B.r.engine==='cold'?200:60,B.dose+Number(id)*st));updateBrew();break}
    case'scale':S.scale=id;save();renderBrew();break;
    case'buyClick':track('clique_compra',{parceiro:id,cafe:el.dataset.c,cupom:(PARC[id]||{}).cupom||null});return;
    case'copyCupom':{const cp=(PARC[id]||{}).cupom;try{navigator.clipboard.writeText(cp).then(()=>toast('Cupom '+cp+' copiado'),()=>toast('Cupom: '+cp))}catch(e){toast('Cupom: '+cp)}track('cupom_copiado',{parceiro:id,cupom:cp});break}
    case'grinderSel':S.grinderId=id;save();B.grindTouched=false;B.grindUsed=null;segOn('#gSel',id);updateBrew();break;
    case'gstep':{const g=curGrinder();B.grindUsed=Math.min(+g.max,Math.max(+g.min,(+B.grindUsed||0)+Number(id)*(g.step<1.5?0.5:1)));B.grindTouched=true;$('#grindUsed').value=B.grindUsed;break}
    case'equip':equipSheet();break;
    case'eqPreset':{const pre=GRINDER_PRESETS.find(g=>g.key===id);const g=Object.assign({id:'g-'+id+'-'+Date.now().toString(36)},pre);S.grinders.push(g);S.grinderId=g.id;save();equipSheet();if($('#brew').classList.contains('open'))renderBrew();toast(pre.name+' adicionado');break}
    case'eqCustom':{const nm=($('#eqName').value||'').trim(),mn=+$('#eqMin').value,mx=+$('#eqMax').value,an=+$('#eqV60').value;if(!nm||!(mx>mn)||!(an>=mn&&an<=mx)){toast('Preencha nome, escala e o número da V60');break}
      const g={id:'g-'+Date.now().toString(36),name:nm,unit:EQ.unit,anchor:an,step:Math.max(.5,Math.round((mx-mn)/12*2)/2),min:mn,max:mx,custom:true};S.grinders.push(g);S.grinderId=g.id;save();equipSheet();if($('#brew').classList.contains('open'))renderBrew();toast(nm+' adicionado');break}
    case'eqUnit':EQ.unit=id;segOn('#eqU',id);break;
    case'eqDel':S.grinders=S.grinders.filter(g=>g.id!==id);if(S.grinderId===id)S.grinderId=S.grinders[0]?S.grinders[0].id:null;save();equipSheet();break;
    case'eqMain':S.grinderId=id;save();equipSheet();break;
    case'eqScale':S.scale=id;save();segOn('#eqS',id);break;
    case'eqMethod':{const i=S.methods.indexOf(id);i>=0?S.methods.splice(i,1):S.methods.push(id);if(!S.methods.length)S.methods=['v60'];save();el.classList.toggle('on',S.methods.includes(id));break}
    case'startTimer':openTimer();break;
    case'closeTimer':cancelAnimationFrame(raf);T=null;$('#timer').classList.remove('open');closeSheet();break;
    case'casa':casaSheet();break;
    case'casaCriar':criarCasa();break;
    case'casaEntrar':entrarCasa();break;
    case'casaSair':sairCasa();break;
    case'casaCopy':{const t=`Entre na minha casa no Agnus Coffee para dividirmos o estoque de café. Código: ${CASA.codigo}`;try{navigator.clipboard.writeText(t).then(()=>toast('Convite copiado'),()=>toast('Código: '+CASA.codigo))}catch(e){toast('Código: '+CASA.codigo)}break}
    case'sound':{const order=['som','voz','mudo'],m=S.sound||'som';S.sound=order[(order.indexOf(m)+1)%3];save();$('#sndBtn').innerHTML=soundIcon();audio();toast(S.sound==='som'?'Som: bipes de contagem':S.sound==='voz'?'Som: bipes e voz dizendo cada etapa':'Som desligado');if(S.sound!=='mudo')cue('go');break}
    case'tplay':if(T.done){openRate();break}setPlay(!T.run);break;
    case'tnext':{const i=curIdx(T.el),nx=T.p.steps[i+1];if(T.el===0&&!T.run){setPlay(true);break}jump(nx?nx.at:T.p.end);break}
    case'tprev':{const i=curIdx(T.el);jump(T.p.steps[Math.max(0,T.el-T.p.steps[i].at<2?i-1:i)].at);break}
    case'rate':R.rate=Number(id);segOn('#cups',id);break;
    case'rtag':{const i=R.tags.indexOf(id);i>=0?R.tags.splice(i,1):R.tags.push(id);el.classList.toggle('on');
      $('#advice').innerHTML=`<p class="label">Para o próximo take</p>${R.tags.length?R.tags.map(t=>`<p style="margin-top:6px">${adviceFor(t)}</p>`).join(''):'<p style="margin-top:6px">Marque o que sentiu e o app sugere o ajuste.</p>'}`;break}
    case'saveTake':{const p=T.p;S.diary.push({n:S.diary.length+1,r:T.r.id,c:S.coffeeId,dose:p.dose,water:p.water,temp:p.temp,ratio:p.ratio,rate:R.rate,tags:R.tags,at:Date.now(),roast:B.roast,sweet:B.sweet,body:B.body,grinder:curGrinder()?curGrinder().name:null,grindUsed:curGrinder()&&B.grindUsed!=null?+B.grindUsed:null});track('preparo',{receita:T.r.id,metodo:T.r.m,cafe:S.coffeeId,dose:p.dose,nota:R.rate,moedor:curGrinder()?curGrinder().name:null,moagem:B.grindUsed});
      const st=(S.stock||{})[S.coffeeId];if(st&&T.r.engine!=='cold'){st.left=Math.max(0,st.left-p.dose);if(CASA){lastCasaSnap=casaSnap();const c1=coffeeById(S.coffeeId);SB.rpc('casa_descontar',{p_casa:CASA.id,p_cafe:S.coffeeId,p_gramas:p.dose,p_texto:`usou ${p.dose} g de ${c1?c1.name:'café'} · ${METHODS[T.r.m]}`,p_meu_nome:firstName()||'Alguém'}).then(()=>{},()=>{})}}
      S.caffeine.push({t:Date.now(),mg:cafFor(T.r,p.dose,coffeeById(S.coffeeId)),label:METHODS[T.r.m]+' · '+T.r.name});save();
      const n=S.diary.length,T0=T.r;closeSheet();cancelAnimationFrame(raf);T=null;$('#timer').classList.remove('open');$('#brew').classList.remove('open');go('inicio');{const c0=coffeeById(S.coffeeId),s0=(S.stock||{})[S.coffeeId];toast(s0&&T0.engine!=='cold'?`−${p.dose} g de ${c0.name} · restam ${Math.round(s0.left)} g`:`Take ${String(n).padStart(2,'0')} salvo`)}{const si=stockInfo(S.coffeeId);if(si&&si.low)setTimeout(()=>renewSheet(S.coffeeId),900)}break}
    case'closeSheet':closeSheet();break;
    case'addcaf':{const mg=cafFor(recipeById('espresso-12'),18,coffeeById(S.coffeeId));S.caffeine.push({t:Date.now(),mg,label:'Espresso'});save();if($('#caf').classList.contains('open'))renderCaf();render();toast('+'+mg+' mg de cafeína');break}
    case'quick':{const [rid,dose]=id.split(':'),r=recipeById(rid),mg=cafFor(r,+dose,coffeeById(S.coffeeId));S.caffeine.push({t:Date.now(),mg,label:METHODS[r.m]+' · '+dose+' g'});save();renderCaf();render();toast('+'+mg+' mg de cafeína');break}
    case'rmDrink':S.caffeine.splice(+id,1);save();renderCaf();render();break;
    case'caf':openCaf();break;
    case'closeCaf':$('#caf').classList.remove('open');render();break;
    case'addCoffee':AC={roast:'media',species:'arabica',pack:250,fill:null};PH=null;AI=null;addCoffeeSheet();break;
    case'acRoast':AC.roast=id;segOn('#acR',id);break;
    case'acSp':AC.species=id;segOn('#acS',id);break;
    case'saveCoffee':{const brand=$('#acBrand').value.trim(),name=$('#acName').value.trim();if(!brand||!name){toast('Preencha marca e nome do café');break}
      const v=k=>($('#'+k).value||'').trim()||null;const notes=$('#acNotes').value.split(',').map(x=>x.trim()).filter(Boolean);
      const prof=/fruta|citr|berry|laranja|manga|cereja/i.test(notes.join(' '))?'frutado':/flor|jasmim|floral/i.test(notes.join(' '))?'floral':/chocolate|cacau|noz|castanha/i.test(notes.join(' '))?'chocolate':'caramelo';
      const c={id:'meu-'+Date.now(),brand,name,roast:AC.roast,species:AC.species,profile:prof,notes:notes.length?notes:['notas a descobrir'],country:v('acCountry'),region:v('acRegion'),variety:v('acVariety'),process:v('acProcess'),seller:v('acSeller'),origin:[v('acRegion'),v('acCountry')].filter(Boolean).join(' · ')||SPECIES[AC.species][0],mine:true};
      const left=AC.pack;
      S.myCoffees.unshift(c);S.coffeeId=c.id;S.stock[c.id]={total:AC.pack,left,at:Date.now(),roastDate:v('acDate'),frozen:$('#acFrz').checked,photo:PH};radarPush(c);if(PH)uploadPhoto(c.id,PH);save();closeSheet();if(B&&$('#brew').classList.contains('open')){B.roast=c.roast;renderBrew()}render();
      {const st=brandStatus(brand);toast(st==='parceira'?'Café salvo · marca parceira Agnus':st==='nova'?'Café salvo · marca nova no radar':'Café salvo no estoque')}break}
    case'enter':enter();break;
    case'acPack':AC.pack=+id;segOn('#acP',id);break;
    case'repeat':case'repeatAdjust':{const h=habit();if(!h)break;if(h.c&&coffeeById(h.c))S.coffeeId=h.c;openBrew(h.r.id,{dose:h.dose,roast:h.roast,sweet:h.sweet,body:h.body});if(a==='repeat')setTimeout(openTimer,450);break}
    case'stockSheet':stockSheet(id);break;
    case'stPack':SP=+id;segOn('#stP',id);break;
    case'saveStock':S.stock[id]={total:SP,left:SP,at:Date.now(),roastDate:$('#stDate').value||null,frozen:$('#stFrz').checked,photo:PH};if(PH)uploadPhoto(id,PH);save();closeSheet();render();if($('#brew').classList.contains('open'))renderBrew();toast('Pacote de '+(SP<1000?SP+' g':'1 kg')+' no estoque');break;
    case'renew':renewSheet(id);break;
    case'refill':{const st=S.stock[id];st.left=st.total;st.at=Date.now();st.roastDate=null;save();closeSheet();render();toast('Estoque renovado');break}
    case'subscribe':S.subscribed=!S.subscribed;save();track('assinatura_interesse',{ativo:S.subscribed});if(SB&&USER)SB.from('perfis').update({assinante:S.subscribed}).eq('user_id',USER.id).then(()=>{},()=>{});renewSheet(id);render();toast(S.subscribed?'Assinatura reservada. Primeiro envio em dezembro':'Assinatura cancelada');break;
    case'demo':seedDemo();break;
    case'landing':showLanding();break;
    case'waitlist':S.waitlist=!S.waitlist;save();render();track('lista_espera',{ativo:S.waitlist});toast(S.waitlist?'Você entrou na lista da Caixa Agnus':'Você saiu da lista');break;
    case'event':{const i=S.events.indexOf(id);i>=0?S.events.splice(i,1):S.events.push(id);save();render();toast(i>=0?'Removido dos seus encontros':'Avisaremos quando abrir inscrição');break}
    case'login':USER?accountSheet():loginSheet();break;
    case'google':loginGoogle();break;
    case'emailLink':loginEmail();break;
    case'logout':logout();break;
    case'soon':toast('Disponível na próxima versão');break;
    case'onboard':openOnboard();break;
    case'obM':{const i=O.methods.indexOf(id);i>=0?O.methods.splice(i,1):O.methods.push(id);el.classList.toggle('on');break}
    case'obS':O.scale=id;segOn('#obS',id);break;
    case'obP':O.palate=Number(id);segOn('#obP',id);break;
    case'obDone':if($('#obName'))S.name=$('#obName').value.trim();if($('#obW'))S.profile={weight:$('#obW').value,height:$('#obH').value,preg:$('#obPreg').checked};S.methods=O.methods.length?O.methods:['v60'];S.scale=O.scale;S.palate=O.palate;S.onboarded=true;save();$('#onboard').classList.remove('open');render();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='grindUsed'){B.grindUsed=+e.target.value;B.grindTouched=true}
  if(e.target.id==='sweet'){B.sweet=Number(e.target.value);updateBrew()}
  if(e.target.id==='body'){B.body=Number(e.target.value);updateBrew()}
  if(e.target.id==='q'){cafeQ=e.target.value;$('#clist').innerHTML=coffeeList()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else if($('#timer').classList.contains('open'))$('[data-act=closeTimer]').click();else if($('#brew').classList.contains('open'))$('[data-act=closeBrew]').click()}});
window.addEventListener('hashchange',route);

/* ---------- início ---------- */
$('#brandmark').innerHTML=lamb()+'<div class="word"><img class="wm" src="brand/agnus-wordmark-black.png" alt="Agnus"><span>COFFEE</span></div>';
$('#brandmark').dataset.act='landing';$('#brandmark').setAttribute('role','button');$('#brandmark').setAttribute('aria-label','Voltar para a entrada');$('#brandmark').tabIndex=0;
$('#lseal').innerHTML=lamb();
route();
initLanding();
initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('App atualizado. Seus dados continuam salvos.')})})}).catch(()=>{})}
</script>
