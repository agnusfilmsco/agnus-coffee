<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agnus Coffee</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Receitas, timer, estoque e clube de cafés especiais da Agnus.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agnus Coffee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400..700&display=swap" rel="stylesheet">
<style>
/* Agnus Coffee · brand book Agnus: laranja #F43A0F, laranja claro #EF5941, marrom #633523, cinza #9B9B9B, preto #0A0A0A.
   Tipografia: Helvetica Neue (títulos, caixa alta, apertada) + Playfair Display itálico (destaques entre parênteses e chaves).
   Layout: entrada animada, depois app de uma tela, coluna de 460px, abas embaixo, telas de preparo sobrepostas. */
:root{
  --ink:#0A0A0A;
  --ink-2:#1C1C1C;
  --bone:#F2F2F0;
  --paper:#FFFFFF;
  --line:#E0DEDA;
  --muted:#6B6B6B;
  --grey:#9B9B9B;
  --agnus:#F43A0F;   /* laranja Agnus (brand book) */
  --agnus-light:#EF5941;
  --agnus-deep:#633523; /* marrom Agnus */
  --agnus-tint:#FDE6DF;
  --display:'Helvetica Neue', Helvetica, Arial, sans-serif;
  --sans:'Helvetica Neue', Helvetica, Arial, sans-serif;
  --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E4E3E0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--agnus);outline-offset:2px}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;background:var(--bone);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 80px rgba(0,0,0,.12)}
.label{text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;font-weight:500;color:var(--muted)}
.ital{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none}
.display{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 10px;background:var(--bone);z-index:3}
.brand{display:flex;align-items:center;gap:10px}
.brand .lamb{width:34px;height:34px}
.lamb{display:block}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.02em;text-transform:uppercase}
.word span{font-weight:500;font-size:9px;letter-spacing:.5em;margin-top:3px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;font-stretch:80%;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pill-btn.solid{background:var(--ink);color:var(--bone)}
.pill-btn.ghost{border-color:var(--line)}

main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px calc(110px + env(safe-area-inset-bottom));scroll-behavior:smooth}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h a,.link{font-stretch:80%;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* entrada das telas */
.st>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.st>*:nth-child(2){animation-delay:.05s}.st>*:nth-child(3){animation-delay:.1s}.st>*:nth-child(4){animation-delay:.15s}.st>*:nth-child(5){animation-delay:.2s}.st>*:nth-child(6){animation-delay:.25s}.st>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* hero */
.hello{padding-top:10px}
.hello h1{font-family:var(--display);font-style:normal;font-weight:700;font-size:31px;line-height:1.02;margin-top:6px;letter-spacing:-.02em}
.hero{position:relative;margin-top:20px;background:var(--ink);color:var(--bone);border-radius:22px;padding:22px 22px 20px;overflow:hidden;isolation:isolate}
.hero .label{color:#BDBDBD}
.hero h2{font-family:var(--display);font-style:normal;font-weight:700;font-size:26px;line-height:1.05;margin:10px 0 6px;letter-spacing:-.02em;max-width:75%}
.hero .meta{color:#DADADA;font-size:13px}
.hero .bigseal{position:absolute;right:-38px;top:-34px;width:190px;height:190px;color:#1F1F1F;--cut:var(--ink);z-index:-1;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.params{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#2A2A2A;border:1px solid #2A2A2A;border-radius:12px;overflow:hidden;margin:18px 0 16px}
.params div{background:var(--ink);padding:10px 8px;text-align:center}
.params b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.params small{font-stretch:70%;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;color:#9B9B9B}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:999px;background:var(--bone);color:var(--ink);font-stretch:85%;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta.red{background:var(--agnus);color:#fff}
.cta.dark{background:var(--ink);color:var(--bone)}
.steam{position:absolute;right:34px;bottom:96px;width:40px;height:60px;opacity:.5}
.steam path{fill:none;stroke:#9B9B9B;stroke-width:1.4;stroke-linecap:round;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* chips de método */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:14px;width:104px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);text-align:left;transition:border-color .2s,transform .2s}
.mchip:hover{border-color:var(--ink)}
.mchip svg{width:30px;height:30px}
.mchip span{font-weight:600;font-size:13px;line-height:1.15}
.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

/* cartões */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coffee-now{display:flex;gap:14px;align-items:center}
.bag{flex:0 0 58px;height:74px;border-radius:6px 6px 10px 10px;background:var(--ink);color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.bag::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#262626 0 3px,var(--ink) 3px 6px)}
.bag i{font-family:var(--display);font-style:normal;font-weight:700;font-size:16px;line-height:1}
.bag small{font-stretch:65%;font-size:7px;letter-spacing:.2em;font-weight:700}
.bag.red{background:#000;color:var(--agnus)}.bag.red .lamb{width:24px;height:24px}.bag.red::before{background:repeating-linear-gradient(90deg,#1a1a1a 0 3px,#000 3px 6px)}
.bag.bone{background:#EDEDED;color:var(--ink)}.bag.bone::before{background:repeating-linear-gradient(90deg,#DCDCDC 0 3px,#EDEDED 3px 6px)}
.cname{font-family:var(--display);font-style:normal;font-size:18px;line-height:1.12;font-weight:700;letter-spacing:-.01em}
.notes{color:var(--muted);font-size:13px;margin-top:3px}
.roastdots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.roastdots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink)}
.roastdots i.on{background:var(--ink)}
.meter{height:6px;background:#ECEBE8;border-radius:9px;overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.meter i.warn{background:var(--agnus)}
.big{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.mini-btn{margin-top:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.mini-btn:hover{border-color:var(--ink)}

.club-teaser{position:relative;border:1px solid var(--ink);border-radius:22px;padding:20px;overflow:hidden;background:var(--paper)}
.club-teaser h3{font-family:var(--display);font-style:normal;font-weight:700;font-size:24px;line-height:1.02;margin:8px 0 6px}
.bags{display:flex;gap:8px;margin:16px 0}
.bags .bag{flex:1;height:84px}
.tag{display:inline-block;font-stretch:72%;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid currentColor}
.tag.red{color:var(--agnus)}
.tag.fill{background:var(--ink);color:var(--bone);border-color:var(--ink)}

/* listas */
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--paper);transition:all .2s}
.f.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s,transform .2s;width:100%}
.rcard:hover{border-color:var(--ink)}
.rcard .mi{width:44px;height:44px;border-radius:12px;background:var(--bone);display:flex;align-items:center;justify-content:center}
.rcard .mi svg{width:26px;height:26px}
.rcard h3{font-family:var(--display);font-style:normal;font-weight:700;font-size:18px;line-height:1.05}
.rcard .by{font-size:12.5px;color:var(--muted);margin-top:2px}
.rcard .rt{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rcard .rt b{display:block;color:var(--ink);font-size:14px}
.page-title{font-family:var(--display);font-style:normal;font-weight:700;font-size:32px;text-transform:uppercase;line-height:1;letter-spacing:-.02em;margin:10px 0 6px}
.lede{color:var(--muted);max-width:36ch;margin-bottom:20px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:11px 16px;margin-bottom:12px}
.search input{border:0;background:none;font:inherit;flex:1;outline:none;min-width:0}
.ccard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);width:100%;transition:border-color .2s}
.ccard:hover{border-color:var(--ink)}
.ccard .top-row{display:flex;justify-content:space-between;align-items:center}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hot{flex:0 0 200px;display:flex;flex-direction:column;gap:12px;text-align:left;padding:16px;border-radius:18px;background:var(--ink);color:var(--bone)}
.hot .label{color:#9B9B9B}
.hot .notes{color:#C8C8C8}
.foot{font-size:12px;color:var(--muted);margin-top:18px}

/* abas */
nav.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,10,10,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:8px;z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:14px;color:#9B9B9B;font-stretch:72%;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transition:color .2s,background .2s}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--bone);background:#262626}

/* camadas (preparo, timer, onboarding) */
.layer{position:absolute;inset:0;background:var(--bone);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.75,.2,1);visibility:hidden}
.layer.open{transform:none;visibility:visible}
.layer.dark{background:var(--ink);color:var(--bone)}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.dark .iconbtn{border-color:#3A3A3A}
.iconbtn svg{width:18px;height:18px}
.lbody{flex:1;overflow-y:auto;padding:0 20px 120px}
.lfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bone) 30%)}
.dark .lfoot{background:linear-gradient(transparent,var(--ink) 30%)}

.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#ECEBE8;border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 4px;border-radius:9px;font-weight:600;font-size:13px;transition:all .2s}
.seg button.on{background:var(--ink);color:var(--bone)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1}
.stepper button:hover{border-color:var(--ink)}
.stepper .v{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center}
.stepper .v small{font-size:14px;color:var(--muted);font-weight:500}
.dw{display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;align-items:center}
.dw .sep{background:var(--line);height:100%}
.slider{margin-top:14px}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.slider .now{font-family:var(--display);font-style:normal;font-weight:700;font-size:19px;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:8px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--bone);border:2px solid var(--ink);margin-top:-11px;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--bone);border:2px solid var(--ink)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15);background:var(--agnus);border-color:var(--agnus)}
.ticks{display:flex;justify-content:space-between;padding:0 10px}
.ticks i{width:1px;height:6px;background:var(--line)}
.changes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chg{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:10px 12px;border-left:2px solid var(--agnus);background:#F6F5F3;border-radius:0 10px 10px 0;animation:pop .35s cubic-bezier(.2,.7,.2,1) both}
.chg b{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg span{color:var(--muted);font-size:13px}
.chg.neutral{border-left-color:var(--line)}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.pgrid div{background:var(--paper);padding:14px}
.pgrid b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:4px;transition:color .3s}
.pgrid b.flash{color:var(--agnus)}
.pgrid p{font-size:12.5px;color:var(--muted);margin-top:2px}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.steps small{display:block;color:var(--muted);font-size:12.5px}
.coffee-pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.coffee-pick .bag{flex-basis:44px;height:56px}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gchips button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600}
.gchips button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.toggle{display:inline-flex;background:#ECEBE8;border-radius:999px;padding:3px}
.toggle button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.toggle button.on{background:var(--ink);color:var(--bone)}

/* timer */
.tc{font-variant-numeric:tabular-nums;font-weight:300;font-size:76px;letter-spacing:-.04em;line-height:1;text-align:center;font-stretch:80%}
.tc-sub{display:flex;justify-content:center;gap:16px;margin-top:8px}
.tc-sub .label{color:#9B9B9B}
.rec{display:inline-flex;align-items:center;gap:6px}
.rec i{width:7px;height:7px;border-radius:50%;background:#5A5A5A}
.rec.live i{background:#E06A2C;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.vessel-wrap{display:flex;justify-content:center;margin:26px 0 18px}
.vessel{position:relative;width:150px;height:170px;border:1.5px solid #4A4A4A;border-top:0;border-radius:0 0 40px 40px;overflow:hidden}
.vessel .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#6b3d22,#3a1f10);transition:height .35s linear}
.vessel .fill::before{content:"";position:absolute;top:-6px;left:-20%;width:140%;height:12px;background:#8a5432;border-radius:50%;opacity:.8;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(8%)}}
.vessel .mark{position:absolute;left:0;right:0;border-top:1px dashed #E06A2C;transition:bottom .4s}
.vessel .mark span{position:absolute;right:6px;top:-18px;font-size:11px;color:#E06A2C;font-variant-numeric:tabular-nums;font-weight:600}
.est{text-align:center;font-variant-numeric:tabular-nums;color:#C8C8C8;font-size:14px}
.now-step{text-align:center;margin-top:16px}
.now-step h2{font-family:var(--display);font-style:normal;font-weight:700;font-size:27px;line-height:1.05;letter-spacing:-.01em}
.now-step p{color:#BDBDBD;margin-top:6px}
.next{margin-top:18px;border:1px solid #2E2E2E;border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.next .label{color:#9B9B9B}
.prog{display:flex;gap:4px;margin-top:18px}
.prog i{flex:1;height:3px;background:#2E2E2E;border-radius:3px;position:relative;overflow:hidden}
.prog i b{position:absolute;inset:0;width:0;background:var(--bone)}
.tctrl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;align-items:center}
.tctrl .sbtn{padding:15px 0;border-radius:999px;border:1px solid #3A3A3A;font-stretch:80%;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.play{padding:17px 0;border-radius:999px;background:var(--bone);color:var(--ink);font-stretch:85%;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.play.pause{background:var(--agnus);color:#fff}

/* folha inferior */
.scrim{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:44}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bone);color:var(--ink);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.75,.2,1);z-index:45}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--display);font-style:normal;font-weight:700;font-size:24px;line-height:1.05;margin:4px 0 8px}
.cups{display:flex;gap:8px;margin:12px 0}
.cups button{flex:1;padding:12px 0;border:1px solid var(--line);border-radius:12px;font-weight:700;font-variant-numeric:tabular-nums;transition:all .2s}
.cups button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600}
.tagpick button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.advice{margin-top:14px;padding:14px;border-radius:12px;background:var(--ink);color:var(--bone)}
.advice .label{color:#9B9B9B}
.picklist{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* onboarding */
.ob{background:var(--ink);color:var(--bone);z-index:30}
.ob .lbody{padding-top:10px}
.ob .intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 10px 10px}
.ob .intro .seal{width:150px;height:150px;color:var(--bone);--cut:var(--ink);animation:sealin 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes sealin{from{opacity:0;transform:rotate(-120deg) scale(.7)}to{opacity:1;transform:none}}
.ob h1{font-family:var(--display);font-style:normal;font-weight:700;font-size:34px;text-transform:uppercase;line-height:1;letter-spacing:-.02em;margin-top:22px;animation:rise .8s .5s both}
.ob .intro p{color:#BDBDBD;max-width:30ch;margin-top:10px;animation:rise .8s .7s both}
.ob h2{font-family:var(--display);font-style:normal;font-weight:700;font-size:21px;margin:28px 0 4px}
.ob .hint{color:#9B9B9B;font-size:13px;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid #3A3A3A;border-radius:14px;font-size:12px;font-weight:600;transition:all .2s}
.mgrid button svg{width:28px;height:28px}
.mgrid button.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.ob .seg{background:#1C1C1C}
.ob .seg button.on{background:var(--bone);color:var(--ink)}
.ob .lfoot{background:linear-gradient(transparent,var(--ink) 30%)}

/* clube */
.club-hero{background:var(--ink);color:var(--bone);border-radius:22px;padding:24px 22px;position:relative;overflow:hidden;isolation:isolate;margin-top:10px}
.club-hero .bigseal{position:absolute;right:-50px;bottom:-60px;width:220px;height:220px;color:#1C1C1C;--cut:var(--ink);z-index:-1;animation:spin 80s linear infinite reverse}
.club-hero h1{font-family:var(--display);font-style:normal;font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em;margin:10px 0 8px}
.club-hero p{color:#C8C8C8;max-width:30ch}
.login{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.login button{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:999px;border:1px solid #3A3A3A;font-weight:600;font-size:14px}
.login button.solid{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.event{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.event:first-child{border-top:0}
.date{text-align:center;border:1px solid var(--ink);border-radius:12px;padding:8px 0}
.date b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-weight:600}
.date small{font-stretch:70%;font-size:10px;letter-spacing:.16em;font-weight:700}
.event h4{margin:0;font-size:15px;font-weight:650;line-height:1.25}
.event p{font-size:12.5px;color:var(--muted)}
.join{padding:8px 12px;border-radius:999px;border:1px solid var(--ink);font-size:12px;font-weight:700;white-space:nowrap}
.join.on{background:var(--ink);color:var(--bone)}

/* diário */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--paper);padding:14px 12px}
.stats b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-stretch:70%;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A8A8A8;padding:6px;line-height:1.15}
.stamp.on{border:1.5px solid var(--agnus);color:var(--agnus);transform:rotate(-8deg);background:var(--agnus-tint)}
.take{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.take:first-child{border-top:0}
.take .tk{font-stretch:65%;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.take .tk b{display:block;font-size:24px;font-stretch:80%;letter-spacing:-.02em}
.take h4{margin:0;font-family:var(--display);font-style:normal;font-weight:700;font-size:16px;line-height:1.1}
.take p{font-size:12.5px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.ex{font-size:10px;color:var(--agnus);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bone);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .35s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* casa */
.casa-cta{position:relative;display:grid;gap:2px;width:100%;text-align:left;padding:14px 44px 14px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.casa-cta b{font-family:var(--display);font-weight:800;font-size:17px}

/* timer: contagem */
.cnt{height:0;overflow:visible;text-align:center;font-family:var(--display);font-weight:900;font-size:0;color:var(--agnus);opacity:0;transition:opacity .2s}
.cnt.on{opacity:1;font-size:15px;height:20px;letter-spacing:.06em}
.cnt.on::before{content:"Próxima etapa em ";font-family:var(--sans);font-weight:600;color:#BDBDBD}
.cnt.on::after{content:" s"}

/* equipamento e compra */
.gin{width:110px;text-align:center;font:inherit;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:inherit;border-radius:0}
.eq-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.eq-row .x{font-size:20px;color:var(--muted);padding:0 4px}
.buy{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cupom{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px dashed var(--agnus);border-radius:var(--r);background:var(--agnus-tint)}
.cupom b{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--agnus)}
a.cta{text-decoration:none}

/* login */
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;margin-top:16px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#topLogin.solid{background:var(--ink);color:var(--bone);border-color:var(--ink)}
#topLogin[data-sync="erro"]{border-color:var(--agnus)}
.ob-login{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.ob-login button{padding:14px;border-radius:999px;border:1px solid #3A3A3A;font-weight:600}
.ob-login button.solid{background:var(--bone);color:var(--ink);border-color:var(--bone)}

/* IA e radar (v7) */
.sd-photo{position:relative;flex:0 0 74px;cursor:pointer;display:block}
.sd-photo .bag{width:70px;height:92px}
.sd-photo span{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,10,.8);color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:4px 2px;border-radius:0 0 10px 10px;text-transform:uppercase;letter-spacing:.04em}
.addph{position:absolute;left:8px;top:8px;background:#fff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--ink)}
.shelf-cta{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;border-radius:var(--r);background:var(--agnus);color:#fff}
.shelf-cta .notes{color:#1C1C1C}
.shelf-ico{flex:0 0 44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.shelf-ico svg{width:26px;height:26px}
.shelf-in{flex-direction:column;align-items:stretch;text-align:center;margin-top:14px}
.shelf-in img{width:100%;height:auto;max-height:260px;object-fit:cover;border-radius:10px}
.shelf-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.shelf-item.off{opacity:.45}
.shelf-item img,.shelf-noimg{flex:0 0 52px;width:52px;height:66px;object-fit:cover;border-radius:8px;background:var(--agnus-tint);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--agnus)}
.shelf-chk{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font-weight:800;font-size:13px}
.shelf-item:not(.off) .shelf-chk{background:var(--ink);color:#fff}
.shelf-w{flex:0 0 64px}.shelf-w input{font-size:17px}
.cta:disabled{opacity:.4}
.del-btn{display:block;width:100%;margin-top:14px;padding:13px;border-radius:999px;border:1px solid var(--agnus);color:var(--agnus);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ai-box{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--agnus-tint);border:1px solid rgba(244,58,15,.3);position:relative;overflow:hidden}
.ai-scan{height:3px;background:rgba(244,58,15,.15);border-radius:3px;overflow:hidden;margin-bottom:10px}
.ai-scan i{display:block;width:35%;height:100%;background:var(--agnus);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-20%)}to{transform:translateX(210%)}}
.radar{background:var(--ink);color:var(--bone);border-radius:22px;padding:20px}
.radar h3{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:10px 0 6px}
.r-sub{color:#BDBDBD;font-size:13px}
.r-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#2E2E2E;border-radius:12px;overflow:hidden;margin-top:14px}
.r-stats div{background:#1C1C1C;padding:12px;text-align:center}
.r-stats b{display:block;font-family:var(--display);font-weight:900;font-size:26px;color:var(--agnus)}
.r-stats span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#BDBDBD}
.r-bar{display:grid;grid-template-columns:90px 1fr 24px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.r-bar i{height:6px;border-radius:6px;background:var(--agnus);display:block}
.r-bar b{text-align:right;font-variant-numeric:tabular-nums}
.r-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #2E2E2E;align-items:flex-start}
.r-brand{font-weight:700;font-size:15px}
.r-meta{color:#BDBDBD;font-size:12.5px;margin:2px 0 6px}
.radar .tag.red{color:#EF5941}.radar .tag.fill{background:var(--agnus);border-color:var(--agnus);color:#fff}
.r-act{display:flex;flex-direction:column;gap:6px}
.r-act button{border:1px solid #4A4A4A;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--bone)}
.months{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.months span{font-size:11px;letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.months span.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.shop{flex:0 0 150px;display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.perks div{background:var(--agnus-tint);border-radius:12px;padding:12px}
.perks b{display:block;font-family:var(--display);font-weight:900;color:var(--agnus);font-size:18px}
.perks span{font-size:12px;color:var(--muted)}

/* estoque, receitas, diário (v6) */
.seg2{grid-template-columns:1fr 1fr}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.est-hero{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bone);border-radius:20px;padding:18px 20px}
.est-hero .label{color:#BDBDBD}
.est-hero .lamb{width:52px;height:52px;border-radius:6px}
.est-total{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-.03em;line-height:1;margin-top:6px}
.est-total small{font-size:16px;font-weight:600}
.est-sub{color:#C8C8C8;font-size:13px;margin-top:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{display:flex;flex-direction:column;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s}
.scard:hover{border-color:var(--ink)}
.scard.done{opacity:.55}
.sphoto{position:relative;aspect-ratio:4/5;background:var(--agnus-tint);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sphoto img{width:100%;height:100%;object-fit:cover;display:block}
.sphoto .bag{width:58%;height:62%;flex:none}
.wbadge{position:absolute;right:8px;bottom:8px;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:5px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.wbadge.warn{background:var(--agnus)}
.frz{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:13px}
.sinfo{display:flex;flex-direction:column;gap:3px;padding:12px}
.sinfo .cname{font-size:16px}
.stars{color:var(--ink);letter-spacing:1px;font-size:12px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.msum{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.msum-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.daynav span{font-weight:650}
.daynav button{width:40px;height:40px;border-radius:12px;font-size:22px}
.daynav button:disabled{opacity:.25;cursor:default}
.photo-in{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px}
.photo-in img{width:56px;height:70px;object-fit:cover;border-radius:8px}
.sd-head{display:flex;gap:14px;align-items:center}
.sd-head img{width:74px;height:92px;object-fit:cover;border-radius:10px}
.sd-head .bag{flex:0 0 70px;height:92px}
.gbtn{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer}

/* hábitos e estoque */
.renew-banner,.explore{position:relative;display:grid;gap:2px;width:100%;text-align:left;padding-right:44px}
.renew-banner{border-color:var(--agnus);background:var(--agnus-tint)}
.explore{grid-template-columns:44px 1fr;gap:14px;align-items:center}
.explore .mi{width:44px;height:44px;border-radius:12px;background:var(--bone);display:flex;align-items:center;justify-content:center}
.explore .mi svg{width:26px;height:26px}
.arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;transition:transform .2s}
.renew-banner:hover .arrow,.explore:hover .arrow{transform:translate(4px,-50%)}

/* entrada */
.landing{position:absolute;inset:0;z-index:50;background:var(--ink);color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:transform 1.1s cubic-bezier(.76,0,.24,1);touch-action:none}
.landing.gone{transform:translateY(-100%);pointer-events:none}
.landing.gone .l-inner{transform:translateY(-30%) scale(.94);opacity:0}
.landing.hidden{display:none}
.l-inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;transition:transform 1.1s cubic-bezier(.76,0,.24,1),opacity .8s}
.l-logo{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.l-logo .seal{width:118px;height:118px;color:var(--agnus);--cut:var(--ink);animation:sealin 1.6s cubic-bezier(.2,.7,.2,1) both,spin 50s linear 1.6s infinite}
.l-logo .lamb{width:64px;height:64px;animation:sealin 1.4s cubic-bezier(.2,.7,.2,1) both}
.l-word b{color:var(--agnus)}
.tech{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--agnus);margin-top:12px}
.tech div{padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--agnus);line-height:1.6}
.tech div+div{border-left:1px solid var(--agnus)}
.l-word{margin-top:26px;overflow:hidden}
.l-word b{display:block;font-family:var(--display);font-style:normal;font-weight:700;font-size:clamp(58px,17vw,84px);line-height:.9;letter-spacing:-.03em;font-weight:900;text-transform:uppercase;animation:upin 1.2s .35s cubic-bezier(.2,.7,.2,1) both}
.l-sub{font-stretch:62%;font-weight:700;font-size:13px;letter-spacing:.9em;margin:14px 0 0 .9em;animation:fadein 1s 1s both}
.l-line{width:1px;height:0;background:var(--agnus);margin:30px 0 22px;animation:grow 1s 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{to{height:54px}}
.l-tag{font-family:var(--sans);font-style:normal;font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:#E0E0E0;max-width:22ch;line-height:1.25;animation:fadein 1s 1.5s both}
.l-meta{display:flex;gap:18px;margin-top:22px;animation:fadein 1s 1.8s both}
.l-meta span{font-stretch:65%;font-weight:700;font-size:10px;letter-spacing:.24em;color:#9B9B9B}
.l-cue{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;font-stretch:65%;font-weight:700;font-size:10.5px;letter-spacing:.3em;color:#BDBDBD;animation:fadein 1s 2.1s both}
.l-cue i{width:22px;height:36px;border:1.5px solid #5A5A5A;border-radius:12px;position:relative}
.l-cue i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--agnus);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.l-grain{position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
.l-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(244,58,15,.22),transparent 65%);top:50%;left:50%;transform:translate(-50%,-58%);animation:breathe 6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:translate(-50%,-58%) scale(1.12);opacity:.7}}
@keyframes upin{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#app.entering main#view .st>*{animation-duration:.9s}
.brand{cursor:pointer}

/* cafeína */
.caf-card{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;width:100%;text-align:left}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:#ECEBE8;stroke-width:6}
.ring .val{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1),stroke .4s}
.ring .val.warn{stroke:var(--agnus)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr b{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .ctr small{font-stretch:70%;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ring.lg{width:200px;height:200px;margin:8px auto 0}
.ring.lg .trk,.ring.lg .val{stroke-width:4}
.ring.lg .ctr b{font-size:48px}
.cups-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cups-row i{width:14px;height:18px;border:1.5px solid var(--ink);border-top:0;border-radius:0 0 5px 5px;position:relative;opacity:.25;transition:opacity .5s}
.cups-row i.on{opacity:1;background:var(--ink)}
.cups-row i.half{opacity:1;background:linear-gradient(transparent 50%,var(--ink) 50%)}
.curve{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.curve .area{fill:url(#cg);opacity:0;animation:fadein 1s .9s forwards}
.curve .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.8s .2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.curve text{font-family:var(--sans);font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.curve .grid{stroke:var(--line);stroke-width:1}
.curve .lim{stroke:var(--agnus);stroke-width:1;stroke-dasharray:3 4}
.curve .now{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.drink{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.drink:first-child{border-top:0}
.drink time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.drink b{font-variant-numeric:tabular-nums}
.drink .x{margin-left:10px;color:var(--muted);font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-stretch:72%;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:650;color:var(--muted)}
.field input{font:inherit;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 0;outline:none;width:100%;border-radius:0;color:inherit}
.field input.txt{font-size:17px;font-weight:500}
.field input:focus{border-bottom-color:var(--agnus)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ob .field label{color:#9B9B9B}
.ob .field input{border-bottom-color:#5A5A5A}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--agnus)}
.disclaim{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.4}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1.5px dashed var(--ink);border-radius:var(--r);font-weight:600;margin-bottom:14px}


/* mais laranja: hero e aba ativa */
.hero{background:var(--agnus);color:var(--ink)}
.hero h2{color:var(--ink)}
.hero .bigseal,.club-hero .bigseal{display:none}
.hero .label{color:rgba(10,10,10,.75)}
.hero .meta{color:rgba(10,10,10,.8)}
.hero .bigseal{color:rgba(255,255,255,.12);--cut:var(--agnus)}
.params{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.18)}
.params div{background:rgba(10,10,10,.12)}
.params small{color:#0A0A0A}
.hero .cta{background:var(--ink);color:#fff}
nav.tabs button.on{background:var(--agnus);color:var(--ink)}
.landing{background:radial-gradient(120% 80% at 50% 35%,#1C1C1C 0%,var(--ink) 70%)}
.l-glow{background:radial-gradient(circle,rgba(244,58,15,.38),transparent 65%)}

/* brand book Agnus (v1.2) */
.hello h1,.hero h2,.page-title,.club-hero h1,.club-teaser h3,.sheet h3,.ob h1,.ob h2,.radar h3,.now-step h2{text-transform:uppercase;letter-spacing:-.045em;line-height:.92;font-weight:700}
.hello h1{font-size:34px}.page-title{font-size:38px}.hero h2{font-size:30px}
.cname{letter-spacing:-.02em}
.lamb{display:block;width:100%;height:auto;border-radius:0}
.brand .lamb{width:32px;height:32px}
.word .wm{height:17px;width:auto;display:block}
.word span{font-weight:500;font-size:8.5px;letter-spacing:.62em;margin-top:4px}
.bag.red{background:#0A0A0A}.bag.red .lamb{width:30px;height:30px}
img.seal{width:120px;height:auto;display:block}
.ob .intro .seal{width:110px;height:110px}
.est-hero .lamb{width:52px;height:52px}
.l-logo .lamb{width:72px;height:72px}
.l-word img{display:block;width:min(78vw,340px);height:auto;animation:upin 1.2s .35s cubic-bezier(.2,.7,.2,1) both}
.l-sub{font-family:var(--sans);font-weight:500;letter-spacing:1em}
.l-tag{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.04em;line-height:.95;color:#fff;text-transform:uppercase;max-width:none}
.l-ital{font-family:var(--serif);font-style:italic;color:var(--agnus-light);font-size:15px;margin-top:10px;animation:fadein 1s 1.6s both}
.l-meta span{font-family:var(--sans);font-weight:500;letter-spacing:.12em}
.l-micro{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));font-size:8px;letter-spacing:.08em;color:#6B6B6B;text-align:center;line-height:1.7;animation:fadein 1s 2s both}
.landing{background:#0A0A0A}
.l-glow{background:radial-gradient(circle,rgba(244,58,15,.30),transparent 62%)}
.pill-btn{font-family:var(--sans);letter-spacing:.04em}
.cta{font-family:var(--sans);letter-spacing:.08em}
.tag{font-family:var(--sans);letter-spacing:.06em}
.est-hero{background:var(--agnus-deep)}
.radar{background:#0A0A0A}
.club-hero{background:var(--agnus-deep)}
.club-hero .label{color:#F4C7B8!important}
.hero .params{background:rgba(10,10,10,.2);border-color:rgba(10,10,10,.2)}
.hero .params div{background:var(--agnus)}
.hero .params small{color:rgba(10,10,10,.7)}
.hero .params b{color:var(--ink)}
.lede{font-family:var(--serif);font-style:italic;font-size:15.5px}
.page-sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:-2px 0 14px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brandmark"></div>
    <button class="pill-btn ghost" data-act="login" id="topLogin">Entrar</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Navegação principal"></nav>

  <section class="layer" id="brew" aria-label="Ajustar receita"></section>
  <section class="layer dark" id="timer" aria-label="Preparo"></section>
  <section class="layer ob" id="onboard" aria-label="Boas-vindas"></section>
  <section class="layer" id="caf" aria-label="Cafeína"></section>

  <section class="landing" id="landing" aria-label="Entrada">
    <div class="l-glow"></div><div class="l-grain"></div>
    <div class="l-inner">
      <button class="l-logo" data-act="enter" aria-label="Entrar no Agnus Coffee"><span id="lseal"></span><span class="l-word"><img src="brand/agnus-wordmark.png" alt="Agnus"></span><span class="l-sub">COFFEE</span></button>
      <span class="l-line"></span>
      <p class="l-tag">{CAFÉS QUE CONTAM<br>HISTÓRIAS}</p>
      <p class="l-ital">(prelúdio 001 · da Agnus para a sua xícara)</p>
      <div class="l-meta"><span>RECEITAS</span><span>//</span><span>ESTOQUE</span><span>//</span><span>CLUBE</span></div>
      <p class="l-micro">AGNUS 2026. TODOS OS DIREITOS RESERVADOS. BRASÍLIA // BSB // BRASIL<br>15°47′38″ SUL &nbsp; 47°52′58″ OESTE</p>
    </div>
    <button class="l-cue" data-act="enter"><i></i>ROLE PARA ENTRAR</button>
  </section>

  <div class="scrim" id="scrim" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- dados ---------- */
const METHODS={
  v60:'Hario V60',chemex:'Chemex',kalita:'Kalita Wave',melitta:'Melitta',prensa:'Prensa Francesa',aeropress:'AeroPress',moka:'Moka',espresso:'Espresso',cold:'Cold Brew'
};
const ICONS={
  v60:'<path d="M6 9h20l-7 12h-6z"/><path d="M10 25h12"/><path d="M26 11h2a2 2 0 0 1 0 4h-3"/>',
  chemex:'<path d="M9 4h14l-5 11 5 13H9l5-13z"/><path d="M12.5 13h7"/>',
  kalita:'<path d="M6 10h20l-3 10H9z"/><path d="M9 24h14"/><path d="M10 14c2 1 4-1 6 0s4-1 6 0"/>',
  melitta:'<path d="M7 9h18l-4 12H11z"/><path d="M10 25h12"/><path d="M16 21v4"/>',
  prensa:'<path d="M10 9h12v18H10z"/><path d="M16 3v10"/><path d="M12 3h8"/><path d="M22 12h3v10h-3"/><path d="M10 14h12"/>',
  aeropress:'<path d="M11 4h10v6H11z"/><path d="M10 10h12v15H10z"/><path d="M7 28h18"/>',
  moka:'<path d="M10 3h12l-2 11h-8z"/><path d="M9 16h14l-2 12H11z"/><path d="M22 6h3l-1 6"/><path d="M8 15h16"/>',
  espresso:'<path d="M6 14h16v4a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M22 15h2a3 3 0 0 1 0 6h-2"/><path d="M11 10c0-2 2-2 2-4"/><path d="M16 10c0-2 2-2 2-4"/>',
  cold:'<path d="M10 8h12v18a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z"/><path d="M9 5h14"/><path d="M13 14h3v3h-3z"/><path d="M16 19h3v3h-3z"/>'
};
const icon=m=>`<svg class="ico" viewBox="0 0 32 32" aria-hidden="true">${ICONS[m]||''}</svg>`;

const COFFEES=[
  {id:'agnus-1',brand:'Agnus Coffee',name:'Prelúdio 001',roast:'media',profile:'caramelo',notes:['doce de leite','caramelo','chocolate'],origin:'Mantiqueira de Minas · 1.200 m',house:true,tech:[['Origem','Minas Gerais'],['Região','Mantiqueira de Minas'],['Altitude','1.200 metros'],['Variedade','Catuaí Amarelo'],['Processo','Natural']]},
  {id:'moka-bala',brand:'Moka Clube',name:'Bala de Caramelo',roast:'media',profile:'caramelo',notes:['caramelo','chocolate ao leite'],origin:'Minas Gerais',hot:true},
  {id:'moka-mezz',brand:'Moka Clube',name:'Mezzanotte',roast:'escura',profile:'chocolate',notes:['chocolate amargo','nozes'],origin:'Minas Gerais'},
  {id:'moka-bela',brand:'Moka Clube',name:'Bela Época Orgânico',roast:'media',profile:'frutado',notes:['frutas amarelas','mel'],origin:'Minas Gerais'},
  {id:'unique-bourbon',brand:'Unique Cafés',name:'Bourbon Amarelo',roast:'clara',roastLabel:'média clara',profile:'frutado',notes:['cítrico','final longo'],origin:'São Lourenço, MG',hot:true},
  {id:'unique-frutado',brand:'Unique Cafés',name:'Frutado',roast:'clara',profile:'frutado',notes:['frutas vermelhas','acidez viva'],origin:'Carmo de Minas, MG'},
  {id:'dropit-allday',brand:'Dropit',name:'All Day',roast:'clara',profile:'chocolate',notes:['chocolate','mel','frutado'],origin:'Linha Essentials',hot:true},
  {id:'dropit-palmer',brand:'Dropit',name:'Palmer',roast:'clara',profile:'frutado',notes:['manga','mel'],origin:'Catuaí Vermelho',hot:true},
  {id:'um-choice',brand:'Um Coffee Co.',name:'Roaster’s Choice',roast:'clara',profile:'floral',notes:['seleção surpresa do mês'],origin:'Curadoria Boram Um',hot:true},
  {id:'orfeu-classico',brand:'Orfeu',name:'Clássico',roast:'media',profile:'chocolate',notes:['chocolate','caramelo'],origin:'Sul de Minas'},
  {id:'octavio-classico',brand:'Octavio Café',name:'Clássico',roast:'escura',profile:'chocolate',notes:['cacau','torrado'],origin:'São Paulo'},
  {id:'tocaya-mant',brand:'Tocaya',name:'Mantiqueira',roast:'media',profile:'caramelo',notes:['caramelo','chocolate'],origin:'Serra da Mantiqueira'},
  {id:'wolff-blend',brand:'Wolff Café',name:'Blend da Casa',roast:'media',profile:'chocolate',notes:['chocolate','castanhas'],origin:'Vários produtores'},
  {id:'coffeelab-casa',brand:'Coffee Lab',name:'Da Casa',roast:'media',profile:'floral',notes:['floral','açúcar mascavo'],origin:'São Paulo'}
];
const ROAST={clara:'Clara',media:'Média',escura:'Escura'};
const PROFILE={chocolate:'Chocolate',caramelo:'Caramelo',frutado:'Frutado',floral:'Floral'};

const RECIPES=[
  {id:'kasuya',m:'v60',name:'Método 4:6',author:'Tetsu Kasuya',tag:'Campeão mundial',desc:'Os primeiros 40% da água decidem doçura ou acidez. Os 60% finais decidem a intensidade.',dose:20,ratio:15,temp:91,grind:6,engine:'kasuya'},
  {id:'hoffmann-v60',m:'v60',name:'Ultimate V60',author:'James Hoffmann',tag:'Clássica',desc:'Bloom generoso e dois despejos contínuos. Xícara limpa e repetível.',dose:15,ratio:16.7,temp:95,grind:5.5,engine:'hoffv60'},
  {id:'chemex-classica',m:'chemex',name:'Chemex para dois',author:'Casa Agnus',tag:'Para dividir',desc:'Filtro grosso, xícara limpíssima. Rende duas ou três xícaras.',dose:30,ratio:16.5,temp:94,grind:7,engine:'pulse',pulses:4,interval:40},
  {id:'kalita-pulse',m:'kalita',name:'Pulsos curtos',author:'Casa Agnus',tag:'Equilíbrio',desc:'Fundo plano e despejos pequenos: extração uniforme e doce.',dose:20,ratio:16,temp:93,grind:6,engine:'pulse',pulses:5,interval:30},
  {id:'melitta-casa',m:'melitta',name:'Coado de casa',author:'Tradição brasileira',tag:'Dia a dia',desc:'O coado de sempre, com medida certa. Mais forte que o coado especial.',dose:30,ratio:13,temp:92,grind:5,engine:'pulse',pulses:3,interval:40},
  {id:'hoffmann-press',m:'prensa',name:'Prensa sem borra',author:'James Hoffmann',tag:'Clássica',desc:'Quebre a crosta, tire a espuma e espere. Corpo sem lama no fundo.',dose:30,ratio:16.7,temp:96,grind:8.5,engine:'press'},
  {id:'hoffmann-aero',m:'aeropress',name:'AeroPress definitiva',author:'James Hoffmann',tag:'Rápida',desc:'Moagem fina, dois minutos de infusão, prensa lenta.',dose:11,ratio:18,temp:98,grind:3.5,engine:'aero'},
  {id:'aero-invertida',m:'aeropress',name:'Invertida',author:'Estilo campeonato',tag:'Encorpada',desc:'De cabeça para baixo: nada pinga antes da hora.',dose:15,ratio:14.5,temp:88,grind:4,engine:'aeroinv'},
  {id:'moka-suave',m:'moka',name:'Moka sem amargor',author:'Casa Agnus',tag:'Italiana',desc:'Água já quente e fogo baixo. Tire do fogo antes de borbulhar.',dose:16,ratio:7,temp:90,grind:3,engine:'moka'},
  {id:'espresso-12',m:'espresso',name:'Espresso 1:2',author:'Padrão de cafeteria',tag:'Base',desc:'18 g entram, 36 g saem, entre 25 e 30 segundos.',dose:18,ratio:2,temp:93,grind:1.2,engine:'espresso'},
  {id:'cold-14',m:'cold',name:'Cold brew 14 h',author:'Casa Agnus',tag:'Verão',desc:'Concentrado de geladeira. Sirva com gelo e água ou leite.',dose:100,ratio:10,temp:null,grind:9.5,engine:'cold'}
];
const byId=(arr,id)=>arr.find(x=>x.id===id);
function allRecipes(){return [...((typeof S!=='undefined'&&S.myRecipes)||[]),...RECIPES]}
function recipeById(id){return allRecipes().find(r=>r.id===id)}
const SPECIES={arabica:['100% arábica',1],blend:['Blend com conilon',1.4],conilon:['Conilon / robusta',1.9],descaf:['Descafeinado',.03]};
function allCoffees(){return [...(S.myCoffees||[]),...COFFEES]}
function coffeeById(id){return allCoffees().find(c=>c.id===id)}

const EVENTS=[
  {id:'e1',d:'12',mo:'DEZ',t:'Cupping às cegas: Mantiqueira × Cerrado',p:'6 cafés, 1 vencedor escolhido pela mesa'},
  {id:'e2',d:'17',mo:'JAN',t:'Um sábado na torrefação parceira',p:'Torra ao vivo e café da manhã'},
  {id:'e3',d:'07',mo:'FEV',t:'Latte art para quem nunca tentou',p:'Turma de 12 pessoas'}
];

/* ---------- estado ---------- */
let CASA=null,lastCasaSnap='',casaT=0,casaCh=null,SB=null,USER=null,RADAR=[],MARCAS={},isTeam=false,UID=null,cloudT=0,cloudReady=false;
const KEY='agnus-coffee-v1';
const DEF={onboarded:false,methods:['v60'],scale:'tem',palate:0,grinder:'comandante',grinders:[],grinderId:null,coffeeId:'dropit-allday',diary:[],waitlist:false,events:[],favorites:['kasuya','hoffmann-press'],caffeine:[],name:'',stock:{},casaId:null,sound:'som',myRecipes:[],subscribed:false,myCoffees:[],profile:{weight:'',height:'',preg:false}};
let S;
const APP_VERSION='1.2.0',STATE_V=2;
/* Migrações: quando um campo mudar de formato numa atualização, adicione um passo aqui.
   Nunca apague campos antigos sem converter: assim ninguém perde dados ao atualizar. */
const GRINDER_PRESETS=[
  {key:'comandante',name:'Comandante C40',unit:'cliques',anchor:23,step:3,min:0,max:45},
  {key:'timemore',name:'Timemore C2',unit:'cliques',anchor:18,step:2.4,min:0,max:36},
  {key:'encore',name:'Baratza Encore',unit:'número',anchor:16,step:4,min:1,max:40}];
const MIGRATIONS={1:st=>st,2:st=>{if(!Array.isArray(st.grinders)){const pre=GRINDER_PRESETS.find(g=>g.key===st.grinder);st.grinders=pre?[Object.assign({id:'g-'+pre.key},pre)]:[];st.grinderId=st.grinders[0]?st.grinders[0].id:null}return st}};
function migrate(st){st=Object.assign({},DEF,st||{});let v=st._v||0;while(v<STATE_V){v++;if(MIGRATIONS[v])st=MIGRATIONS[v](st)||st}st._v=STATE_V;return st}
try{S=migrate(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=migrate({})}
function save(){S._rev=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(CASA&&cloudReady&&casaSnap()!==lastCasaSnap){clearTimeout(casaT);casaT=setTimeout(pushCasa,900)}if(SB&&USER&&cloudReady){clearTimeout(cloudT);cloudT=setTimeout(pushCloud,1200)}}
function cloudCopy(){const c=JSON.parse(JSON.stringify(S));Object.values(c.stock||{}).forEach(st=>{if(st.photo&&String(st.photo).startsWith('data:'))st.photo=null});return c}
async function pushCloud(){if(!SB||!USER)return;try{const {data:cur}=await SB.from('user_state').select('state').eq('user_id',USER.id).maybeSingle();if(cur&&cur.state&&(cur.state._rev||0)>(S._rev||0)){applyCloud(cur.state);return}const {error}=await SB.from('user_state').upsert({user_id:USER.id,state:cloudCopy(),updated_at:new Date().toISOString()});if(error)throw error;setSync('ok')}catch(e){setSync('erro')}}
function applyCloud(st){const keep=S.stock;S=migrate(st);Object.entries(keep||{}).forEach(([k,v])=>{if(S.stock[k]&&v.photo&&String(v.photo).startsWith('data:')&&!S.stock[k].photo)S.stock[k].photo=v.photo});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!document.querySelector('.layer.open'))render();setSync('ok')}
async function pullCloud(){if(!SB||!USER||!cloudReady)return;try{const {data}=await SB.from('user_state').select('state').eq('user_id',USER.id).maybeSingle();if(data&&data.state&&(data.state._rev||0)>(S._rev||0))applyCloud(data.state)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullCloud()});
function setSync(st){const b=document.getElementById('topLogin');if(b&&USER)b.dataset.sync=st}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const mmss=t=>{t=Math.max(0,Math.round(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const fmtRatio=r=>(Math.round(r*10)/10).toString().replace('.',',');

function compute(r,c){
  const s=c.sweet,b=c.body,ro=c.roast;
  let temp=r.temp,grind=r.grind,ratio=r.ratio;
  if(temp!=null){temp=Math.min(100,Math.round(temp+{clara:3,media:0,escura:-4}[ro]+s))}
  grind=Math.max(1,Math.min(10,grind+{clara:-.3,media:0,escura:.4}[ro]-s*.3));
  if(r.engine==='espresso')ratio=2-b*.25;
  else if(r.engine==='cold')ratio=r.ratio-b;
  else if(r.engine==='moka')ratio=r.ratio;
  else ratio=Math.max(12,r.ratio-b*.6);
  const dose=c.dose,water=Math.round(dose*ratio);
  const out=ENG[r.engine](dose,water,s,b,r);
  const ch=[];
  if(temp!=null&&ro!=='media')ch.push(['Temperatura '+temp+'°C',ro==='clara'?'Torra clara é mais densa e pede mais calor':'Torra escura extrai rápido: menos calor evita amargor']);
  if(s>0)ch.push(['Mais calor e moagem mais fina','Extrai mais açúcares: xícara mais doce e redonda']);
  if(s<0)ch.push(['Menos calor e moagem mais grossa','Segura a extração: realça acidez e brilho']);
  if(out.extra&&out.extra.p1!=null&&s!==0)ch.push([`1º despejo de ${out.extra.p1} g`,s>0?'Despejo inicial menor aumenta a doçura no 4:6':'Despejo inicial maior aumenta a acidez no 4:6']);
  if(b!==0&&r.engine==='espresso')ch.push([`Rende ${water} g (1:${fmtRatio(ratio)})`,b>0?'Mais curto, tipo ristretto: denso e aveludado':'Mais longo, tipo lungo: leve e aberto']);
  else if(b!==0&&r.engine!=='moka')ch.push([`Proporção 1:${fmtRatio(ratio)}`,b>0?'Mais café por água: corpo aveludado':'Menos café por água: xícara leve e limpa']);
  if(out.extra&&out.extra.n!=null&&b!==0)ch.push([`${out.extra.n} despejos finais`,b>0?'Mais despejos, mais intensidade':'Menos despejos, mais leveza']);
  if(out.extra&&out.extra.sp!=null&&b!==0)ch.push([`Infusão até ${mmss(out.extra.sp)}`,b>0?'Mais tempo de contato, mais corpo':'Menos contato, mais leveza']);

  return{temp,grind,ratio,dose,water,steps:out.steps,end:out.end,changes:ch};
}

function curIdx(el){const s=T.p.steps;let i=0;for(let k=0;k<s.length;k++)if(s[k].at<=el)i=k;return i}
function estAt(el){const s=T.p.steps;let prev=0,est=0;for(let k=0;k<s.length;k++){const st=s[k];if(st.at>el)break;if(st.target!=null){const nx=s[k+1]?s[k+1].at:T.p.end;const pd=Math.max(4,Math.min(20,nx-st.at-5));est=prev+(st.target-prev)*Math.min(1,(el-st.at)/pd);prev=st.target}}return Math.round(est)}
function tick(){
  if(!T)return;
  if(T.run)T.el=T.base+(performance.now()-T.t0)/1000;
  const p=T.p,el=Math.min(T.el,p.end),i=curIdx(el),s=p.steps[i],nx=p.steps[i+1];
  if(T.run){const target=nx?nx.at:p.end,secs=Math.ceil(target-el);
    if(secs>=1&&secs<=10&&secs!==T.lastBeep){T.lastBeep=secs;cue(secs<=3?'hi':'lo');const ct=$('#cnt');if(ct){ct.textContent=secs;ct.classList.add('on')}}
    if(secs>10){const ct=$('#cnt');if(ct)ct.classList.remove('on')}
    if(T.lastIdx!==i){if(T.lastIdx!=null||el<0.5){cue('go');speak(s.title)}T.lastIdx=i;T.lastBeep=null;const ct=$('#cnt');if(ct)ct.classList.remove('on')}}
  $('#tc').textContent=mmss(el);
  const total=p.water||1,est=estAt(el);
  $('#fill').style.height=Math.min(100,est/total*100)+'%';
  const tgt=[...p.steps].slice(0,i+1).reverse().find(x=>x.target!=null);
  if(tgt){$('#mark').style.display='';$('#mark').style.bottom=(tgt.target/total*100)+'%';$('#markL').textContent=tgt.target+' g'}else $('#mark').style.display='none';
  $('#est').textContent=T.r.engine==='moka'?'Fogo baixo, tampa aberta':`≈ ${est} g de ${total} g`;
  $('#stT').textContent=T.el===0&&!T.run?'Escalde o filtro e zere a balança':s.title;
  $('#stN').textContent=T.el===0&&!T.run?`Pó pronto: ${p.dose} g, ${grindText(p.grind).toLowerCase()}`:s.note;
  $('#nxT').textContent=T.el===0&&!T.run?p.steps[0].title:(nx?nx.title:'Avaliar a xícara');
  $('#nxA').textContent=T.el===0&&!T.run?'00:00':(nx?'em '+mmss(nx.at-el):'');
  document.querySelectorAll('#prog b').forEach((b,k)=>{const st=p.steps[k],en=p.steps[k+1]?p.steps[k+1].at:p.end;b.style.width=Math.max(0,Math.min(1,(el-st.at)/(en-st.at)))*100+'%'});
  $('#rec').classList.toggle('live',T.run);
  if(T.el>=p.end&&!T.done){cue('end');speak('Pronto. Hora de provar.');T.done=true;T.run=false;$('#play').textContent='Avaliar';$('#play').classList.remove('pause');openRate();return}
  if(T.run)raf=requestAnimationFrame(tick);
}

function soundIcon(){const m=S.sound||'som';return m==='mudo'?'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 4 6m0-6-4 6"/></svg>':m==='voz'?'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>':'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>'}

const PARTNERS=['agnus coffee','dropit','unique cafes'];
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const slugify=t=>norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'sem-marca';
function brandStatus(b){const n=norm(b);if(!n)return'nova';if(PARTNERS.some(p=>n.includes(p)))return'parceira';if(COFFEES.some(c=>norm(c.brand)===n))return'conhecida';return'nova'}
const BSTAT={parceira:['Parceira Agnus','fill'],conhecida:['Sem parceria','red'],nova:['Marca nova','red'],conversa:['Em conversa','red'],fechada:['Parceria fechada','fill'],descartada:['Sem interesse','']};
function dataToBlob(u){const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}

  const prompt=`Você recebe a foto de um pacote de café, que pode ser de qualquer país e em qualquer idioma. Leia o rótulo com atenção e responda SOMENTE um objeto JSON, sem texto fora dele, com estas chaves:
{"brand":texto|null,"name":texto|null,"country":texto em português|null,"region":texto|null,"producer":texto|null,"variety":texto|null,"process":texto em português|null,"roast":"clara"|"media"|"escura"|null,"species":"arabica"|"blend"|"conilon"|"descaf"|null,"notes":[até 4 notas sensoriais em português],"weight_g":número|null,"roast_date":"AAAA-MM-DD"|null,"altitude_m":número|null,"seller":texto|null,"confidence":"alta"|"media"|"baixa"}
Regras: use null quando algo não estiver legível; não invente marca, data ou peso. "country" é o país de origem do grão. "seller" só se o rótulo indicar loja ou cafeteria. Torra média-clara conta como "clara"; média-escura como "escura".`;
  try{

  }catch(e){box.innerHTML=`<p class="label">Não consegui ler o rótulo</p><p class="notes" style="margin-top:4px">${e&&e.code==='rate_limited'?'Muitas leituras seguidas. Tente de novo em instantes.':'Tente uma foto mais de frente e com luz, ou preencha abaixo.'}</p>${e&&(e.code||e.message)?`<p class="disclaim">Detalhe: ${String(e.code||'')} ${String(e.message||'').slice(0,120)}</p>`:''}`}

let AI=null;
function fillFromAI(r){
  const set=(id,v)=>{if(v!=null&&v!==''&&$('#'+id))$('#'+id).value=v};
  set('acBrand',r.brand);set('acName',r.name);set('acCountry',r.country);set('acRegion',r.region||r.producer);set('acVariety',r.variety);set('acProcess',r.process);
  if(r.notes&&r.notes.length)set('acNotes',r.notes.join(', '));set('acDate',r.roast_date);set('acSeller',r.seller);
  if(['clara','media','escura'].includes(r.roast)){AC.roast=r.roast;segOn('#acR',r.roast)}
  if(SPECIES[r.species]){AC.species=r.species;segOn('#acS',r.species)}
  if(r.weight_g>0){AC.pack=Math.round(r.weight_g);segOn('#acP',AC.pack)}
  $('#acFillNote').textContent=(r.weight_g&&![250,500,1000].includes(Math.round(r.weight_g))?'Pacote de '+Math.round(r.weight_g)+' g lido no rótulo. ':'')+'Entra cheio no estoque. Cada preparo desconta a dose usada.';
  const st=brandStatus(r.brand),b=BSTAT[st];
  $('#aiBox').innerHTML=`<p class="label" style="color:var(--agnus)">Identificado · confiança ${r.confidence||'média'}</p><p class="cname" style="margin-top:4px">${r.brand||'Marca não legível'}${r.name?' · '+r.name:''}</p><p class="notes">${[r.country,r.region,r.variety,r.process].filter(Boolean).join(' · ')||'Origem não informada no rótulo'}</p><span class="tag ${b[1]}" style="margin-top:8px;display:inline-block">${b[0]}</span><p class="disclaim">Confira os campos abaixo antes de salvar.</p>`;
}

function cropBox(src,box){return new Promise(res=>{if(!box||box.length!==4)return res(null);const img=new Image();img.onload=()=>{let [x,y,w,h]=box.map(Number);if([x,y,w,h].some(isNaN)||w<=0||h<=0)return res(null);const pad=4;x=Math.max(0,x-pad);y=Math.max(0,y-pad);w=Math.min(100-x,w+pad*2);h=Math.min(100-y,h+pad*2);
  const sx=img.width*x/100,sy=img.height*y/100,sw=img.width*w/100,sh=img.height*h/100,k=Math.min(1,420/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};img.onerror=()=>res(null);img.src=src})}
async function identifyShelf(){

  const prompt=`Você recebe uma foto com um ou mais pacotes de café (estoque de uma pessoa), de qualquer país e idioma. Identifique CADA pacote visível e responda SOMENTE um objeto JSON:
{"packages":[{"brand":texto|null,"name":texto|null,"country":texto em português|null,"region":texto|null,"variety":texto|null,"process":texto em português|null,"roast":"clara"|"media"|"escura"|null,"species":"arabica"|"blend"|"conilon"|"descaf"|null,"notes":[até 4 notas em português],"weight_g":número|null,"roast_date":"AAAA-MM-DD"|null,"box":[x,y,largura,altura em % da imagem, de 0 a 100]}]}
Regras: um item por pacote, sem repetir; use null no que não estiver legível e não invente marca, peso ou data; "box" é o retângulo aproximado do pacote na foto. Torra média-clara conta como "clara"; média-escura como "escura".`;
  try{const r=await callIA('shelf',SH.photo);const pk=(r&&r.packages)||[];
    SH.items=await Promise.all(pk.map(async q=>Object.assign({},q,{on:true,weight:Math.round(q.weight_g)||250,crop:await cropBox(SH.photo,q.box)})));renderShelf();
  }catch(e){box.innerHTML=`<div class="ai-box"><p class="label">Não consegui ler a foto</p><p class="notes" style="margin-top:4px">${e&&e.code==='rate_limited'?'Muitas leituras seguidas. Tente de novo em instantes.':'Tente com mais luz e os rótulos de frente.'}</p>${e&&(e.code||e.message)?`<p class="disclaim">Detalhe: ${String(e.code||'')} ${String(e.message||'').slice(0,120)}</p>`:''}</div>`}
}
