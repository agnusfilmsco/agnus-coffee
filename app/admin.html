<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Agnus Coffee</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400..700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Painel da equipe: marrom, branco e laranja Agnus; tabela-first, leitura rápida. */
:root{--ink:#0A0A0A;--bone:#F2F2F0;--paper:#FFFFFF;--line:#E0DEDA;--muted:#6B6B6B;--agnus:#F43A0F;--brown:#633523;--tint:#FDE6DF;--display:'Helvetica Neue',Helvetica,Arial,sans-serif;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--agnus);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bone);display:flex;align-items:center;gap:14px;padding:14px 20px}
header .mark{width:30px;height:30px;display:block}
.center .mark{width:84px;height:84px;margin:0 auto}
header h1{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0;text-transform:uppercase}
header .sp{flex:1}
header .who{font-size:12.5px;color:#BDBDBD}
header .out{border:1px solid #4A4A4A;border-radius:999px;padding:6px 12px;font-size:12px}
nav{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bone);position:sticky;top:58px;z-index:4}
nav button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:20px}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:4px 0 14px;letter-spacing:-.045em;text-transform:uppercase;line-height:.95}
.label{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.hi{background:var(--agnus);color:var(--ink);border-color:var(--agnus)}.kpi.hi .label{color:#1C1C1C}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F3ECE5;vertical-align:top}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.tag.o{color:var(--agnus)}.tag.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--paper)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.o{background:var(--agnus);color:#fff;border-color:var(--agnus)}
input.f,select.f{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.muted{color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--agnus);display:block}
.feed div{padding:8px 0;border-bottom:1px solid #F3ECE5;display:flex;gap:10px}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.center{max-width:420px;margin:12vh auto;padding:0 20px;text-align:center}
.center h1{font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase}
.login{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.login button{padding:13px;border-radius:999px;border:1px solid var(--line);font-weight:600;background:#fff}
.login .dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#D8C6B6}
.live i{width:7px;height:7px;border-radius:50%;background:#7bd389}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const MARK='<img class="mark" src="brand/agnus-mark.png" alt="">';
const $=s=>document.querySelector(s),root=$('#root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
const TIPOS={cadastro:'Novo cadastro',acesso:'Acesso',clique_compra:'Clique para comprar',cupom_copiado:'Cupom copiado',preparo:'Preparo',lista_espera:'Lista da caixa',assinatura_interesse:'Interesse em assinar'};

const cfg=window.AGNUS_CONFIG||{};let SB=null,USER=null,tab='resumo',D={};
if(!window.supabase||!cfg.SUPABASE_URL||/SEU-PROJETO/.test(cfg.SUPABASE_URL)){root.innerHTML=`<div class="center">${MARK}<h1>Painel Agnus Coffee</h1><p class="muted">Configure o Supabase em <b>config.js</b> para usar o painel.</p></div>`}
else{SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
  SB.auth.onAuthStateChange((e,s)=>{const u=s?s.user:null;if(u&&(!USER||USER.id!==u.id)){USER=u;boot()}else if(!u){USER=null;loginView()}});
  SB.auth.getSession().then(({data})=>{if(!data.session)loginView()})}

function loginView(){root.innerHTML=`<div class="center">${MARK}<h1>Painel Agnus Coffee</h1><p class="muted">Acesso da equipe.</p>
  <div class="login"><button class="dark" id="g">Entrar com Google</button><input class="f" id="em" type="email" placeholder="seu@email.com" aria-label="E-mail"><button id="mail">Receber link por e-mail</button><p class="muted" id="msg"></p></div></div>`;
  $('#g').onclick=()=>SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
  $('#mail').onclick=async()=>{const e=$('#em').value.trim();if(!e)return;const {error}=await SB.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});$('#msg').textContent=error?'Não consegui enviar agora.':'Link enviado para '+e+'.'}}

async function boot(){
  const {data:adm}=await SB.from('admins').select('user_id').eq('user_id',USER.id).maybeSingle();
  if(!adm){root.innerHTML=`<div class="center">${MARK}<h1>Sem acesso</h1><p class="muted">${esc(USER.email)} ainda não é da equipe. Peça para incluir seu e-mail na tabela <b>admins</b> (passo 7 do README).</p><div class="login"><button id="out">Sair</button></div></div>`;$('#out').onclick=()=>SB.auth.signOut();return}
  await loadAll();render();
  SB.channel('painel').on('postgres_changes',{event:'INSERT',schema:'public',table:'eventos'},p=>{D.feed=[p.new,...(D.feed||[])].slice(0,200);if(p.new.tipo==='cadastro')loadAll().then(render);else render()}).subscribe();
}
async function loadAll(){
  const q=(t,f)=>f(SB.from(t)).then(r=>r.data||[],()=>[]);
  const [res,perfis,compras,feed,vendas,parc,radar,marcas]=await Promise.all([
    q('painel_resumo',x=>x.select('*')),q('perfis',x=>x.select('*').order('criado_em',{ascending:false}).limit(2000)),
    q('painel_compras_por_marca',x=>x.select('*')),q('eventos',x=>x.select('*').neq('tipo','acesso').order('created_at',{ascending:false}).limit(200)),
    q('vendas',x=>x.select('*').order('data',{ascending:false}).limit(500)),q('parceiros',x=>x.select('*').order('nome')),
    q('radar_marcas',x=>x.select('*').order('pacotes',{ascending:false})),q('marcas',x=>x.select('*'))]);
  D={res:res[0]||{},perfis,compras,feed,vendas,parc,radar,marcas:Object.fromEntries(marcas.map(m=>[m.slug,m]))};
}
const nameOf=id=>{const p=(D.perfis||[]).find(x=>x.user_id===id);return p?(p.nome||p.email):'—'};
function render(){
  const T=[['resumo','Resumo'],['cadastros','Cadastros'],['compras','Compras e cupons'],['vendas','Vendas'],['parceiros','Parceiros'],['radar','Radar de marcas']];
  root.innerHTML=`<header>${MARK}<h1>Painel Agnus Coffee</h1><span class="live"><i></i>ao vivo</span><span class="sp"></span><span class="who">${esc(USER.email)}</span><button class="out" id="out">Sair</button></header>
  <nav>${T.map(([k,n])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</nav><main>${V[tab]()}</main>`;
  $('#out').onclick=()=>SB.auth.signOut();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  (A[tab]||(()=>{}))();
}
function csv(rows,cols,name){const lines=[cols.map(c=>c[1]).join(';'),...rows.map(r=>cols.map(c=>'"'+String(typeof c[0]==='function'?c[0](r):(r[c[0]]??'')).replace(/"/g,'""')+'"').join(';'))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download=name;a.click()}

const V={
  resumo(){const r=D.res;return `<h2>Resumo</h2><div class="kpis">
    <div class="kpi hi"><p class="label">Cadastros</p><b>${r.cadastros??0}</b></div><div class="kpi"><p class="label">Novos em 7 dias</p><b>${r.cadastros_7d??0}</b></div>
    <div class="kpi"><p class="label">Ativos em 7 dias</p><b>${r.ativos_7d??0}</b></div><div class="kpi"><p class="label">Acessos hoje</p><b>${r.acessos_hoje??0}</b></div>
    <div class="kpi"><p class="label">Cliques para comprar</p><b>${r.cliques_compra??0}</b></div><div class="kpi"><p class="label">Cupons copiados</p><b>${r.cupons_copiados??0}</b></div>
    <div class="kpi"><p class="label">Vendas confirmadas</p><b>${r.vendas??0}</b></div><div class="kpi"><p class="label">Receita das vendas</p><b style="font-size:22px">${brl(r.receita_vendas)}</b></div></div>
    <div class="card"><p class="label">Atividade recente</p><div class="feed">${(D.feed||[]).slice(0,40).map(e=>`<div><time>${dt(e.created_at)}</time><span><b>${esc(TIPOS[e.tipo]||e.tipo)}</b> · ${esc(nameOf(e.user_id))}${e.dados&&e.dados.parceiro?' · '+esc(e.dados.parceiro):''}${e.dados&&e.dados.cupom?' · cupom '+esc(e.dados.cupom):''}</span></div>`).join('')||'<p class="muted">Sem atividade ainda.</p>'}</div></div>`},
  cadastros(){return `<div class="row" style="justify-content:space-between"><h2>Cadastros · ${D.perfis.length}</h2><div class="row"><input class="f" id="busca" placeholder="Buscar nome ou e-mail" aria-label="Buscar"><button class="btn dark" id="csvP">Exportar CSV</button></div></div>
    <div class="card tbl"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Entrou por</th><th>Cadastro</th><th>Último acesso</th><th class="n">Acessos</th><th>Moedores</th><th>Assinante</th></tr></thead><tbody id="tbP"></tbody></table></div>`},
  compras(){const max=Math.max(1,...D.compras.map(c=>c.cliques));const cl=(D.feed||[]).filter(e=>e.tipo==='clique_compra'||e.tipo==='cupom_copiado');
    return `<h2>Compras e cupons</h2><p class="muted">Cliques e cupons acontecem no app. A venda acontece no site do parceiro: confirme pelo relatório de cupom dele e lance em Vendas.</p>
    <div class="card tbl"><table><thead><tr><th>Parceiro</th><th class="n">Cliques</th><th></th><th class="n">Cupons copiados</th><th class="n">Pessoas</th><th>Último</th></tr></thead><tbody>${D.compras.map(c=>`<tr><td><b>${esc(c.parceiro)}</b></td><td class="n">${c.cliques}</td><td style="width:30%"><span class="bar" style="width:${c.cliques/max*100}%"></span></td><td class="n">${c.cupons_copiados}</td><td class="n">${c.pessoas}</td><td>${dt(c.ultimo)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhum clique ainda.</td></tr>'}</tbody></table></div>
    <div class="card tbl"><div class="row" style="justify-content:space-between"><p class="label">Quem clicou</p><button class="btn" id="csvC">Exportar CSV</button></div><table><thead><tr><th>Quando</th><th>Pessoa</th><th>Ação</th><th>Parceiro</th><th>Café</th><th>Cupom</th></tr></thead><tbody>${cl.map(e=>`<tr><td>${dt(e.created_at)}</td><td>${esc(nameOf(e.user_id))}</td><td>${esc(TIPOS[e.tipo])}</td><td>${esc(e.dados.parceiro)}</td><td>${esc(e.dados.cafe||'')}</td><td>${esc(e.dados.cupom||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">—</td></tr>'}</tbody></table></div>`},
  vendas(){return `<h2>Vendas</h2><div class="card"><p class="label">Lançar venda confirmada</p><div class="grid2" style="margin-top:10px">
    <select class="f" id="vP" aria-label="Parceiro">${D.parc.map(p=>`<option value="${esc(p.slug)}">${esc(p.nome)}</option>`).join('')}</select><input class="f" id="vC" placeholder="Cupom" aria-label="Cupom"><input class="f" id="vV" type="number" step="0.01" placeholder="Valor (R$)" aria-label="Valor"><input class="f" id="vCl" placeholder="Cliente (opcional)" aria-label="Cliente"><input class="f" id="vD" type="date" aria-label="Data"><button class="btn o" id="vAdd">Lançar</button></div></div>
    <div class="card tbl"><div class="row" style="justify-content:space-between"><p class="label">${D.vendas.length} vendas · ${brl(D.vendas.reduce((a,v)=>a+Number(v.valor||0),0))}</p><button class="btn" id="csvV">Exportar CSV</button></div><table><thead><tr><th>Data</th><th>Parceiro</th><th>Cupom</th><th>Cliente</th><th class="n">Valor</th><th>Origem</th></tr></thead><tbody>${D.vendas.map(v=>`<tr><td>${esc(v.data)}</td><td>${esc(v.parceiro)}</td><td>${esc(v.cupom)}</td><td>${esc(v.cliente)}</td><td class="n">${brl(v.valor)}</td><td>${esc(v.origem)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhuma venda lançada.</td></tr>'}</tbody></table></div>`},
  parceiros(){return `<h2>Parceiros</h2><p class="muted">O link e o cupom aparecem no app, no botão "Comprar" de cada café da marca. Salvou aqui, o app já usa.</p>
    <div class="card tbl"><table><thead><tr><th>Marca</th><th>Link da loja</th><th>Cupom</th><th>Benefício</th><th>Ativo</th><th></th></tr></thead><tbody>${D.parc.map(p=>`<tr data-slug="${esc(p.slug)}"><td><b>${esc(p.nome)}</b><br><span class="muted">${esc(p.slug)}</span></td><td><input class="f" data-k="url_loja" value="${esc(p.url_loja||'')}" placeholder="https://loja..." style="width:100%"></td><td><input class="f" data-k="cupom" value="${esc(p.cupom||'')}" style="width:110px"></td><td><input class="f" data-k="desconto" value="${esc(p.desconto||'')}" style="width:100%"></td><td><input type="checkbox" data-k="ativo" ${p.ativo?'checked':''} aria-label="Ativo"></td><td><button class="btn dark" data-save>Salvar</button></td></tr>`).join('')}</tbody></table></div>
    <div class="card"><p class="label">Novo parceiro</p><div class="grid2" style="margin-top:10px"><input class="f" id="nN" placeholder="Nome da marca (como no rótulo)"><input class="f" id="nU" placeholder="Link da loja"><input class="f" id="nC" placeholder="Cupom"><input class="f" id="nD" placeholder="Benefício"><button class="btn o" id="nAdd">Adicionar</button></div></div>`},
  radar(){return `<h2>Radar de marcas</h2><p class="muted">Marcas que a comunidade tem em casa. As sem parceria são contatos para a próxima caixa.</p>
    <div class="card tbl"><table><thead><tr><th>Marca</th><th class="n">Pacotes</th><th class="n">Pessoas</th><th>Países</th><th>Último</th><th>Status</th><th></th></tr></thead><tbody>${D.radar.map(r=>{const slug=r.marca_key.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const parc=D.parc.some(p=>p.slug===slug);const st=parc?'parceira':(D.marcas[slug]||{}).status||'nova';
      return `<tr><td><b>${esc(r.marca)}</b></td><td class="n">${r.pacotes}</td><td class="n">${r.pessoas}</td><td>${esc((r.paises||[]).filter(Boolean).join(', '))}</td><td>${dt(r.ultimo_cadastro)}</td><td><span class="tag ${st==='parceira'||st==='fechada'?'f':'o'}">${{parceira:'Parceira',fechada:'Fechada',conversa:'Em conversa',descartada:'Sem interesse',nova:'Nova'}[st]||st}</span></td><td>${parc?'':`<select class="f" data-st="${esc(slug)}" aria-label="Mudar status"><option value="">Mudar…</option><option value="conversa">Em conversa</option><option value="fechada">Fechada</option><option value="descartada">Sem interesse</option></select>`}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Nenhum pacote cadastrado ainda.</td></tr>'}</tbody></table></div>`}
};
const A={
  cadastros(){const draw=()=>{const q=($('#busca').value||'').toLowerCase();$('#tbP').innerHTML=D.perfis.filter(p=>!q||(p.nome||'').toLowerCase().includes(q)||(p.email||'').toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.email)}</td><td>${esc(p.provedor)}</td><td>${dt(p.criado_em)}</td><td>${dt(p.ultimo_acesso)}</td><td class="n">${p.acessos}</td><td>${esc((p.moedores||[]).join(', '))}</td><td>${p.assinante?'<span class="tag f">Sim</span>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Nenhum cadastro.</td></tr>'};
    draw();$('#busca').oninput=draw;$('#csvP').onclick=()=>csv(D.perfis,[['nome','Nome'],['email','E-mail'],['provedor','Entrou por'],['criado_em','Cadastro'],['ultimo_acesso','Último acesso'],['acessos','Acessos'],[r=>(r.moedores||[]).join(', '),'Moedores'],[r=>r.assinante?'sim':'','Assinante']],'agnus-cadastros.csv')},
  compras(){$('#csvC').onclick=()=>csv((D.feed||[]).filter(e=>e.tipo==='clique_compra'||e.tipo==='cupom_copiado'),[['created_at','Quando'],[r=>nameOf(r.user_id),'Pessoa'],[r=>TIPOS[r.tipo],'Ação'],[r=>r.dados.parceiro,'Parceiro'],[r=>r.dados.cafe||'','Café'],[r=>r.dados.cupom||'','Cupom']],'agnus-cliques.csv')},
  vendas(){$('#vD').value=new Date().toISOString().slice(0,10);$('#csvV').onclick=()=>csv(D.vendas,[['data','Data'],['parceiro','Parceiro'],['cupom','Cupom'],['cliente','Cliente'],['valor','Valor'],['origem','Origem']],'agnus-vendas.csv');
    $('#vAdd').onclick=async()=>{const row={parceiro:$('#vP').value,cupom:$('#vC').value||null,valor:Number($('#vV').value)||null,cliente:$('#vCl').value||null,data:$('#vD').value};const {error}=await SB.from('vendas').insert(row);if(error)return toast('Não consegui lançar');toast('Venda lançada');await loadAll();render()}},
  parceiros(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),row={};tr.querySelectorAll('[data-k]').forEach(i=>row[i.dataset.k]=i.type==='checkbox'?i.checked:(i.value.trim()||null));row.updated_at=new Date().toISOString();
      const {error}=await SB.from('parceiros').update(row).eq('slug',tr.dataset.slug);toast(error?'Não consegui salvar':'Parceiro salvo');if(!error){await loadAll()}});
    $('#nAdd').onclick=async()=>{const nome=$('#nN').value.trim();if(!nome)return toast('Digite o nome da marca');const slug=nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const {error}=await SB.from('parceiros').insert({slug,nome,url_loja:$('#nU').value||null,cupom:$('#nC').value||null,desconto:$('#nD').value||null});toast(error?'Não consegui adicionar':'Parceiro adicionado');await loadAll();render()}},
  radar(){document.querySelectorAll('[data-st]').forEach(s=>s.onchange=async()=>{if(!s.value)return;const {error}=await SB.from('marcas').upsert({slug:s.dataset.st,status:s.value,updated_by:USER.id,updated_at:new Date().toISOString()});toast(error?'Não consegui salvar':'Status atualizado');await loadAll();render()})}
};
</script>
</body>
</html>
